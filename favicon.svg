<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flashcards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c85ff" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe3ff" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <!-- carte arrière -->
  <rect x="19" y="12" width="27" height="34" rx="5"
        transform="rotate(9 32 30)" fill="#ffffff" opacity=".45" />
  <!-- carte avant -->
  <rect x="17" y="16" width="29" height="35" rx="5.5" fill="url(#card)" />
  <g stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" opacity=".85">
    <path d="M23 26h17" />
    <path d="M23 32h17" />
    <path d="M23 38h10" />
  </g>
</svg>
