  <!-- 23. Prévention du flash de thème au premier rendu -->
  <script>
    try {
      const savedTheme = localStorage.getItem("physics-flashcards-theme");
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
      document.documentElement.dataset.theme = theme;
    } catch {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <!-- CSS critique inline -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 12. Déclaration explicite du schéma de couleurs */
    html {
      color-scheme: dark;
    }
    html[data-theme="light"] {
      color-scheme: light;
    }

    /* 11. Variables et fallbacks universels sans color-mix() */
    :root {
      --bg: #0b1020; --surface: #12172b; --text: #e6ecff;
      --primary: #6366f1; --primary-600: #5457e6;
      --border: #232a48; --muted: #8aa0d3;
      --green: #22c55e; --blue: #3b82f6; --amber: #f59e0b; --red: #ef4444;
      --fs-term: 20px; --fs-def: 24px; --radius-md: 14px;
      --btn-neutral-bg: rgba(255,255,255,.06);
      --btn-neutral-fg: #e6ecff;
      --btn-neutral-bd: #232a48;
      --btn-soft-primary-bg: rgba(99,102,241,0.22);
      --btn-soft-primary-fg: #dbe4ff;
      --btn-soft-primary-bd: rgba(99,102,241,0.55);
      --btn-solid-primary-bg: var(--primary);
      --btn-solid-primary-fg: #fff;
      --btn-solid-primary-bd: var(--primary-600);
    }
    [data-theme="light"] {
      --bg: #f8fafc; --surface: #fff; --text: #0f172a;
      --primary: #3b82f6; --primary-600: #2563eb;
      --border: #cbd5e1; --muted: #475569;
      --btn-neutral-bg: #f1f5f9;
      --btn-neutral-fg: #0f172a;
      --btn-neutral-bd: #cbd5e1;
      --btn-soft-primary-bg: #e8f1ff;
      --btn-soft-primary-fg: #1d4ed8;
      --btn-soft-primary-bd: #93baf5;
    }

    /* 11. Amélioration progressive avec color-mix() */
    @supports (color: color-mix(in srgb, black, white)) {
      :root {
        --btn-soft-primary-bg: color-mix(in srgb, var(--primary) 22%, transparent);
        --btn-soft-primary-bd: color-mix(in srgb, var(--primary) 55%, transparent);
      }
      [data-theme="light"] {
        --btn-soft-primary-bg: color-mix(in srgb, var(--primary) 14%, white 86%);
        --btn-soft-primary-fg: color-mix(in srgb, var(--primary) 78%, black 22%);
        --btn-soft-primary-bd: color-mix(in srgb, var(--primary) 35%, white 65%);
      }
    }

    body { background: var(--bg); color: var(--text); font-size: 17px; }

    /* Splash */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: var(--bg);
      transition: opacity .3s ease-out;
    }
    #splash .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: sp .6s linear infinite;
    }
    @supports (color: color-mix(in srgb, black, white)) {
      #splash .spinner {
        border-color: color-mix(in srgb, var(--primary) 25%, transparent);
        border-top-color: var(--primary);
      }
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* 14. Classes remplaçant les styles inline */
    .splash__label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .topbar__spacer {
      flex: 1 1 auto;
      min-width: 8px;
    }
    .topbar__icon-action {
      flex: 0 0 auto;
      width: auto;
      padding: 6px 12px;
    }
    .topbar__external-link {
      flex: 0 0 auto;
      width: auto;
      padding: 6px 12px;
      text-decoration: none;
    }

    /* 3. Géométrie générale de l'application */
    .wrapper {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }
    @supports (height: 100dvh) {
      .wrapper {
        height: 100dvh;
        min-height: 100dvh;
      }
    }

    .phone {
      position: relative;
      display: grid;
      grid-template-rows:
        var(--row-top, 56px)
        minmax(0, 1fr)
        var(--row-actions, 0px)
        var(--row-rev, 0px);

      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      max-height: 100%;

      overflow: hidden;
      touch-action: pan-y;
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; padding: 0 10px;
    }
    .topbar .back {
      appearance: none; border: 0; background: transparent;
      color: var(--text); padding: 8px 10px; margin-right: 4px;
      border-radius: 10px; display: flex; align-items: center;
      gap: 8px; cursor: pointer; font-weight: 700;
    }
    .topbar .title {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 8px 6px;
      margin-left: 2px;
      text-align: left;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      min-width: 0;
      flex-shrink: 1;
    }

    /* 5. Défilement accessible du conteneur principal */
    main#view {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;

      padding: 8px;
      gap: 10px;

      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
      -webkit-overflow-scrolling: touch;
    }
    main#view.view--locked {
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* 4. Safe area non doublée */
    .bottom-actions,
    .revision-bar,
    .review-actions-bar {
      padding: 8px 10px;
      display: none;
      background: transparent;
      border-top: 0;
    }
    .bottom-actions { gap: 8px; grid-template-columns: 1fr 1fr; }

    /* 7 & 8. Boutons, zones tactiles et transitions d'état */
    .btn {
      background: var(--btn-bg, var(--btn-neutral-bg));
      color: var(--btn-fg, var(--btn-neutral-fg));
      border: 1px solid var(--btn-bd, var(--btn-neutral-bd));
      border-radius: var(--radius-md);
      padding: 10px 12px; font-weight: 900; cursor: pointer;
      width: 100%; appearance: none; font-size: 15px;
      min-height: 44px;
      line-height: 1.2;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition:
        background-color 140ms ease,
        border-color 140ms ease,
        color 140ms ease,
        transform 80ms ease,
        opacity 140ms ease;
    }
    .btn--ghost {
      --btn-bg: transparent; --btn-fg: var(--muted); --btn-bd: var(--border);
    }
    .btn--primary {
      --btn-bg: var(--btn-soft-primary-bg);
      --btn-fg: var(--btn-soft-primary-fg);
      --btn-bd: var(--btn-soft-primary-bd);
    }
    .btn--solid.btn--primary {
      --btn-bg: var(--btn-solid-primary-bg);
      --btn-fg: var(--btn-solid-primary-fg);
      --btn-bd: var(--btn-solid-primary-bd);
    }
    .btn--tiny {
      min-height: 40px;
      min-width: 40px;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 10px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover {
        filter: brightness(1.08);
      }
    }
    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .btn:disabled,
    .btn[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      filter: none;
    }

    /* 6. Focus clavier visible */
    :where(button, a, [role="button"]):focus {
      outline: none;
    }
    :where(button, a, [role="button"]):focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 72%, white 28%);
      outline-offset: 3px;
    }
    @supports not (color: color-mix(in srgb, black, white)) {
      :where(button, a, [role="button"]):focus-visible {
        outline-color: #818cf8;
      }
    }

    /* 19. Classe pour lecteurs d'écran */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* 10. Contraste forcé */
    @media (forced-colors: active) {
      .btn,
      .topbar .back {
        border: 1px solid ButtonText;
      }
      #splash .spinner {
        border-color: GrayText;
        border-top-color: Highlight;
      }
    }

    /* 9. Réduction des animations */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      #splash .spinner {
        animation: none;
      }
    }
  </style>

  <!-- 22. Configuration MathJax et chargement durci (version figée, timeout & nettoyage en cas d'erreur) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$','$'],['\\(','\\)']],
        displayMath: [['$$','$$'],['\\[','\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script','style','textarea'] },
      startup: { typeset: false }
    };

    let _mathJaxLoading = null;
    window.loadMathJax = function () {
      if (window.MathJax?.typesetPromise) {
        return window.MathJax.startup?.promise ?? Promise.resolve();
      }

      if (_mathJaxLoading) {
        return _mathJaxLoading;
      }

      _mathJaxLoading = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        let settled = false;

        const timeoutId = window.setTimeout(() => {
          if (settled) return;
          settled = true;
          script.remove();
          _mathJaxLoading = null;
          reject(new Error("Le chargement de MathJax a expiré."));
        }, 15000);

        script.src = "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js";
        script.async = true;

        script.addEventListener("load", async () => {
          if (settled) return;
          try {
            await window.MathJax?.startup?.promise;
            if (!window.MathJax?.typesetPromise) {
              throw new Error("MathJax est chargé mais indisponible.");
            }
            settled = true;
            window.clearTimeout(timeoutId);
            resolve();
          } catch (error) {
            settled = true;
            window.clearTimeout(timeoutId);
            _mathJaxLoading = null;
            reject(error);
          }
        }, { once: true });

        script.addEventListener("error", () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeoutId);
          script.remove();
          _mathJaxLoading = null;
          reject(new Error("Impossible de charger MathJax."));
        }, { once: true });

        document.head.appendChild(script);
      });

      return _mathJaxLoading;
    };
  </script>
