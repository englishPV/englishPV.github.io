  <!-- ── CSS critique inline : 1er rendu instantané, sans requête réseau ── -->
  <style>
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url('fonts/inter-latin-wght-normal.woff2') format('woff2');
    }
    :root, :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a0b0f; --surface: #12141a; --surface-2: #171922; --surface-3: #1e212b;
      --card: #12141a; --text: #f2f4f8; --muted: #98a1b3; --faint: #6c7488;
      --border: #242835; --divider: rgba(255,255,255,.06);
      --primary: #6366f1; --primary-600: #5457e6;
      --green: #22c55e; --blue: #3b82f6; --amber: #f59e0b; --red: #ef4444;
      --fs-term: 20px; --fs-def: 24px;
      --radius-md: 12px; --radius-lg: 16px; --radius-full: 999px;
      --font-sans: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7f9; --surface: #fff; --surface-2: #f4f5f7; --surface-3: #eceef2;
      --card: #fff; --text: #0f1319; --muted: #5c6472; --faint: #8b93a1;
      --border: #e2e5eb; --divider: rgba(15,23,42,.07);
      --primary: #3b82f6; --primary-600: #2563eb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; letter-spacing: -.011em;
    }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); transition: opacity .3s ease-out;
    }
    #splash .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2.5px solid color-mix(in srgb, var(--primary) 22%, transparent);
      border-top-color: var(--primary);
      animation: sp .7s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    #splash .splash-text { font-size: 12.5px; font-weight: 600; color: var(--faint); }
    .app-shell { display: flex; height: 100dvh; width: 100%; overflow: hidden; }
    .phone {
      position: relative; flex: 1; min-width: 0; height: 100%;
      display: grid;
      grid-template-rows: var(--row-top, 56px) var(--row-tabs, 0px) 1fr
                          var(--row-actions, 0px) var(--row-rev, 0px);
      overflow: hidden;
    }
    .topbar { grid-row: 1; } #driveTabs { grid-row: 2; } main#view { grid-row: 3; }
    .bottom-actions { grid-row: 4; } .revision-bar, .review-actions-bar { grid-row: 5; }
    .topbar {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--divider);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
    }
    .topbar-inner { display: flex; align-items: center; gap: 6px; width: 100%; height: 100%; padding: 0 8px; }
    .title {
      display: inline-flex; align-items: center; gap: 7px; min-width: 0;
      padding: 6px 10px; border-radius: 8px;
      font-size: 15px; font-weight: 700; letter-spacing: -.018em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .icon-btn {
      display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none;
      border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 15px;
    }
    .spacer { flex: 1; }
    .ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none;
           stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .ico--xs { width: 14px; height: 14px; } .ico--sm { width: 16px; height: 16px; }
    main#view { min-height: 0; min-width: 0; height: 100%; display: flex; flex-direction: column; padding: 12px 10px; }
    .hidden { display: none !important; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      width: 100%; min-height: 40px; padding: 9px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      background: rgba(255,255,255,.05); color: var(--text);
      font: 600 14px/1 var(--font-sans); cursor: pointer;
    }
    .btn--solid.btn--primary { background: var(--primary); border-color: var(--primary-600); color: #fff; }
  </style>

  <!-- MathJax : configuration seule, le script n'est chargé qu'à la demande -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'style', 'textarea'] },
      startup: { typeset: false }
    };
    let _mathJaxLoading = null;
    window.loadMathJax = function () {
      if (window.MathJax?.typesetPromise) return Promise.resolve();
      if (_mathJaxLoading) return _mathJaxLoading;
      _mathJaxLoading = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
        s.onload = function () {
          (function check() {
            window.MathJax?.typesetPromise ? res() : setTimeout(check, 50);
          })();
        };
        s.onerror = rej;
        document.head.appendChild(s);
      });
      return _mathJaxLoading;
    };
  </script>
